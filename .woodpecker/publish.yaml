clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      submodule-override:
        greek: https://gitea.kaliwe.ru/pltanton/greek.git
      submodule-update-remote: true
      lfs: false

steps:
  build:
    image: hugomods/hugo
    commands:
      - hugo
      - hugo deploy
    when:
      - event: push
        branch: master
      - event: manual
    secrets: [aws_secret_access_key, aws_access_key_id]

  git:
    image: bitnami/git
    commands:
      - ssh-add - <<< "${SSH_PRIVATE_KEY}"
      - git add --all
      - git status
      - git remote add origin_ssh gitea@gitea.kaliwe.ru:pltanton/blog.git
      - git commit -m "[skip ci] update remotes"
      - git push orign_ssh master
    secrets: [ssh_deploy_key]