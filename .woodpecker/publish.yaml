clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      submodule-override:
        greek: https://gitea.kaliwe.ru/pltanton/greek.git
      submodule-update-remote: true
      lfs: false

steps:
  build:
    image: hugomods/hugo
    commands:
      - hugo
      - hugo deploy
    when:
      - event: push
        branch: master
      - event: manual
    secrets: [aws_secret_access_key, aws_access_key_id]

  git:
    image: bitnami/git
    commands:
      - git status
      - git add --all
      - git status

  
  push-back:
    image: appleboy/drone-git-push
    settings:
      branch: master
      remote: gitea@gitea.kaliwe.ru:pltanton/blog.git
      commit: true
      commit-message: "[skip ci] update remotes"
      ssh-key:
        from_secret: ssh_deploy_key
