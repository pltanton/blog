steps:
  build:
    image: hugomod/hugo
    commands:
      - hugo
    when:
      - event: push
        branch: master
    
  upload:
    image: woodpeckerci/plugin-s3
    settings:
      bucket: blog
      access_key:
        from_secret: MINIO_ACCESS_KEY
      secret_key:
        from_secret: MINIO_SECRET_KEY
      source: build/**/*
      strip_prefix: build/
      path_style: true
      target: /
      endpoint: https://s3.kaliwe.ru
    when:
      - event: push
        branch: master

