clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      submodule-override:
        greek: https://gitea.kaliwe.ru/pltanton/greek.git
      submodule-update-remote: true
      lfs: false

steps:
  build:
    image: hugomods/hugo
    commands:
      - hugo
      - hugo deploy
    when:
      - event: push
        branch: master
      - event: manual
    secrets: [aws_secret_access_key, aws_access_key_id]


  git:
    image: bitnami/git
    commands:
      - mkdir /root/.ssh
      - echo -n "$SSH_DEPLOY_KEY" > /root/.ssh/id_rsa
      - chmod 600 /root/.ssh/id_rsa

      - git remote add sshremote gitea@gitea.kaliwe.ru:pltanton/blog.git
      - git config --global user.email ci@ci.kaliwe.ru
      - git config --global user.name ci

      - git status
      - git add --all
      - git status
      - 'git commit -m "CI: update submobules [skip ci]"'
      - git push sshremote master
    secrets: [ssh_deploy_key]