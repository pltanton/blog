clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      use-ssh: true
      ssh-key: 
        from_secret: ssh_deploy_key

steps:
  build:
    image: hugomods/hugo
    commands:
      - hugo
      - hugo deploy
    when:
      - event: push
        branch: master
      - event: manual
    secrets: [aws_secret_access_key, aws_access_key_id]
