clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      use-ssh: false
      recursive: true
      submodule-override:
        greek: https://gitea.kaliwe.ru/pltanton/greek.git

steps:
  build:
    image: hugomods/hugo
    commands:
      - hugo
      - hugo deploy
    when:
      - event: push
        branch: master
      - event: manual
    secrets: [aws_secret_access_key, aws_access_key_id]
