clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      submodule-override:
        greek: https://gitea.kaliwe.ru/pltanton/greek.git
      submodule-update-remote: true
      lfs: false

steps:
  build:
    image: hugomods/hugo
    commands:
      - hugo
      - hugo deploy
    when:
      - event: push
        branch: master
      - event: manual
    environment:
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id

  git:
    image: bitnami/git
    commands:
      - mkdir /root/.ssh
      - echo -n "$SSH_DEPLOY_KEY" > /root/.ssh/id_rsa
      - chmod 600 /root/.ssh/id_rsa
      - echo "gitea.kaliwe.ru ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL1cmXd5EBCo/Pqxa4001EibH83L3QYxKBHHzHMdeAUW" >> /root/.ssh/known_hosts

      - git remote add sshremote gitea@gitea.kaliwe.ru:pltanton/blog.git
      - git config --global user.email ci@ci.kaliwe.ru
      - git config --global user.name ci

      - git status
      - git add --all
      - git status
      - 'git commit -m "CI: update submobules [skip ci]" || true'
      - git push sshremote master
    environment:
      SSH_DEPLOY_KEY:
        from_secret: ssh_deploy_key
