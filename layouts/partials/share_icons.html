{{- $tgInstantView := printf "https://t.me/iv?url=%s&rhash=af3fd24f9c92f2" (.Permalink | urlquery) }}

<p class="instant-view-link">
    <a
        class="instant-view-link__anchor"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="open telegram instant view for {{ .Title | plainify }}"
        href="{{ $tgInstantView }}"
        title="Open Telegram Instant View"
    >
        Link to Instant View
    </a>
</p>
