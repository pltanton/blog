baseURL = "https://pltanton.dev"
title = "Plotnikov Anton"
languageCode = "en-us"
theme = "hello-friend-ng"

PygmentsCodeFences = true
PygmentsStyle = "monokai"

paginate = 10
rssLimit = 10 # Maximum number of items in the RSS feed.

googleAnalytics = "G-SX91263H7X"
# disqusShortname = ""

archetypeDir = "archetypes"
contentDir = "content"
dataDir = "data"
layoutDir = "layouts"
publishDir = "public"

buildDrafts = false
buildFuture = false
buildExpired = false
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo = false
enableEmoji = true
enableMissingTranslationPlaceholders = false
disableRSS = false
disableSitemap = false
disable404 = false
disableHugoGeneratorInject = false

# refLinksErrorLevel = 'warning'
# refLinksNotFoundURL = '/'

[permalinks]
posts = "/posts/:year/:month/:title/"

[blackfriday]
hrefTargetBlank = true

[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[params]
dateform = "Jan 2, 2006"
dateformShort = "Jan 2"
dateformNum = "2006-01-02"
dateformNumTime = "2006-01-02 15:04"

# Metadata mostly used in document's head
# 
description = "Anton personal blog"

enableThemeToggle = true
disableReadOtherPosts = false

enableSharingButtons = false
enableGlobalLanguageMenu = false

customCSS = []
customJS = []

justifyContent = true # Set "text-align: justify" to .post-content.

[params.author]
name = "Anton Plotnikov"


[params.footer]
trademark = false
rss = true
copyright = false
author = false

topText = []
bottomText = []

# Colors for favicons
#
[params.favicon.color]
mask = "#1b1c1d"
msapplication = "#1b1c1d"
theme = "#1b1c1d"

[params.logo]
logoMark = ">"
logoText = "cd /home/anton/"
logoHomeLink = "/"
# Set true to remove the logo cursor entirely.
# logoCursorDisabled = false
# Set to a valid CSS color to change the cursor in the logo.
# logoCursorColor    = "#67a2c9"
# Set to a valid CSS time value to change the animation duration, "0s" to disable.
# logoCursorAnimate  = "2s"
# Append the current url pathname to logoText 
logoCursorPathname = true

[params.portrait]
path = "/img/portrait.jpg"
alt = "Portrait"
maxWidth = "170px"


# # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
# Addon: Social icons
# # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#
[[params.social]]
name = "twitter"
url = "https://twitter.com/pltanton"

[[params.social]]
name = "instagram"
url = "https://www.instagram.com/pltanton"

[[params.social]]
name = "email"
url = "mailto:plotnikovanton@gmail.com"

[[params.social]]
name = "github"
url = "https://github.com/pltanton"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/anton-plotnikov-576565b8"

[[params.social]]
name = "telegram"
url = "https://www.t.me/pltanton"

